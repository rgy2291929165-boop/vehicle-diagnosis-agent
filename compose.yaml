services:
  agent:
    image: vehicle-diagnosis-agent:week4
    build:
      context: .
    ports:
      - "127.0.0.1:${AGENT_PORT:-8002}:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)) == {'status': 'ok'}"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
